name: CI

on:
  pull_request:
  push:
    branches: [primary]

# Only keep the latest run per branch/PR; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-test:
    name: Check & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type & content check
        run: npm run check

      - name: Unit tests
        run: npm run test

  integration:
    name: Integration tests (Supabase)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Write local env from Supabase
        run: |
          {
            echo "PUBLIC_APP_URL=http://localhost:4321"
            echo "PUBLIC_DEFAULT_LOCALE=es"
            supabase status -o env \
              | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' \
              | sed -E 's/^API_URL=/PUBLIC_SUPABASE_URL=/; s/^ANON_KEY=/PUBLIC_SUPABASE_ANON_KEY=/; s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
              | tr -d '"'
          } > .env.local

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Write local env from Supabase
        run: |
          {
            echo "PUBLIC_APP_URL=http://localhost:4321"
            echo "PUBLIC_DEFAULT_LOCALE=es"
            supabase status -o env \
              | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' \
              | sed -E 's/^API_URL=/PUBLIC_SUPABASE_URL=/; s/^ANON_KEY=/PUBLIC_SUPABASE_ANON_KEY=/; s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
              | tr -d '"'
          } > .env.local

      - name: Seed e2e fixture
        run: npm run seed:test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
