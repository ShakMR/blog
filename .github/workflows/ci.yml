name: CI

on:
  pull_request:
  push:
    branches: [primary]

# Only keep the latest run per branch/PR; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-test:
    name: Check & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type & content check
        run: npm run check

      - name: Unit tests
        run: npm run test

  integration:
    name: Integration tests (Supabase)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start Supabase
        run: supabase start

      - name: Write local env from Supabase
        run: |
          {
            echo "PUBLIC_APP_URL=http://localhost:4321"
            echo "PUBLIC_DEFAULT_LOCALE=es"
            supabase status -o env \
              | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=' \
              | sed -E 's/^API_URL=/PUBLIC_SUPABASE_URL=/; s/^PUBLISHABLE_KEY=/PUBLIC_SUPABASE_ANON_KEY=/; s/^SECRET_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
              | tr -d '"'
          } > .env.local

      - name: Debug key resolution (temporary)
        run: |
          echo "== all status -o env key names =="
          supabase status -o env | cut -d= -f1 | tr '\n' ' '; echo
          echo "== .env.local heads =="
          node -e 'for(const l of require("fs").readFileSync(".env.local","utf8").split("\n")){const i=l.indexOf("=");if(i<0)continue;console.log(l.slice(0,i),"head="+l.slice(i+1,i+16))}'
          echo "== process.env supabase-ish names =="
          env | grep -iE 'supa|anon|service_role|publishable|secret' | cut -d= -f1 | sort | tr '\n' ' '; echo
          echo "== live service-key test (SECRET_KEY vs legacy SERVICE_ROLE_KEY) =="
          node --input-type=module -e '
            import { execSync } from "node:child_process";
            import { createClient } from "@supabase/supabase-js";
            const env = execSync("supabase status -o env",{encoding:"utf8"});
            const get = (k) => { const m = env.match(new RegExp("^"+k+"=\"?([^\"\\n]+)","m")); return m?m[1]:null; };
            const url = get("API_URL");
            for (const name of ["SECRET_KEY","SERVICE_ROLE_KEY"]) {
              const key = get(name);
              if (!key) { console.log(name, "MISSING"); continue; }
              const svc = createClient(url, key, { auth:{persistSession:false} });
              const { data, error } = await svc.auth.admin.listUsers();
              const { error: e2 } = await svc.from("comment_rate_limits").upsert({ key:"diag", attempt_count:1, window_start:new Date().toISOString(), updated_at:new Date().toISOString() });
              console.log(name, "head="+key.slice(0,14), "| listUsers:", error?("ERR "+error.status):"OK", "| rate_limit upsert:", e2?("ERR: "+e2.message):"OK");
            }
          '

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start Supabase
        run: supabase start

      - name: Write local env from Supabase
        run: |
          {
            echo "PUBLIC_APP_URL=http://localhost:4321"
            echo "PUBLIC_DEFAULT_LOCALE=es"
            supabase status -o env \
              | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=' \
              | sed -E 's/^API_URL=/PUBLIC_SUPABASE_URL=/; s/^PUBLISHABLE_KEY=/PUBLIC_SUPABASE_ANON_KEY=/; s/^SECRET_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' \
              | tr -d '"'
          } > .env.local

      - name: Seed e2e fixture
        run: npm run seed:test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
